name: Veille automatique
on:
  schedule:
    - cron: "30 5 * * *"   # ~7 h 30 (heure de Paris en été)
    - cron: "0 11 * * *"   # ~13 h
  workflow_dispatch:        # bouton « Run workflow » pour lancer à la main
permissions:
  contents: write
jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update_veille.py
      - name: Publier si changement
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add data/veille.json
          git diff --staged --quiet || (git commit -m "Veille du $(date -u +%F %H:%M) UTC" && git push)
